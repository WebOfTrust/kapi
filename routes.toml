# Curated half of the KAPI route registry.
#
# scripts/getroutes.py finds the routes; this file says what they are. Each entry is
# keyed by message type and route (placeholders compare equal whatever they are named).
# A route the extractor finds that has no entry here is reported as unclassified.
#
# tier: protocol | interop | application   (defined in routes.md)
# status = "proposed" marks a route under review that the source need not have yet.
# status = "retired" keeps the record of a route keripy has dropped, so its name is not reused.
# Tiers below are a first draft for maintainer review, not settled.

# ---- reply (rpy) ----

[[route]]
msg = "rpy"
route = "/end/role/{action}"
tier = "protocol"
note = "KERI spec names `/end/role/add` and `/end/role/cut` as literal routes; keripy registers one template."

[[route]]
msg = "rpy"
route = "/loc/scheme"
tier = "protocol"
note = "KERI spec."

[[route]]
msg = "rpy"
route = "/ksn/{aid}"
tier = "interop"
note = "Key state notice. Conveys key state but a verifier still needs the KEL, so not protocol."

[[route]]
msg = "rpy"
route = "/ksn"
tier = "interop"
note = "Cue label only. The reply Kevery actually builds for a `ksn` query is `/ksn/{src}` (core/eventing.py:5577)."

[[route]]
msg = "rpy"
route = "/tsn/registry"
tier = "interop"
note = "Tevery answers a `tsn` query by cueing a reply on this route, without the `{aid}` segment the handler template `/tsn/registry/{aid}` has. Whether such a reply is routable has not been checked."

[[route]]
msg = "rpy"
route = "/tsn/credential"
tier = "interop"
note = "As `/tsn/registry`: cued without the `{aid}` segment of `/tsn/credential/{aid}`. Not checked."

[[route]]
msg = "rpy"
route = "/tsn/registry/{aid}"
tier = "interop"
note = "Registry transaction state notice."

[[route]]
msg = "rpy"
route = "/tsn/credential/{aid}"
tier = "interop"
note = "Credential transaction state notice."

[[route]]
msg = "rpy"
route = "/watcher/{aid}/{action}"
tier = "interop"
note = "Controller tells its watcher what to watch; two implementations of the watcher role must agree."

[[route]]
msg = "rpy"
route = "/introduce"
tier = "interop"
note = "OOBI introduction. Handled with no suffix, so by `Oobiery.processReply` itself."

[[route]]
msg = "rpy"
route = "/decl/tags"
tier = "interop"
status = "proposed"
note = "Proposed in keripy#1685, not on main; that PR adds a v2 KRAM exemption for `/decl/`. Self-asserted witness tags (e.g. `testnet`), same shape as `/loc/scheme`. See routes.md."

[[route]]
msg = "rpy"
route = "/decl/attribs"
tier = "interop"
status = "proposed"
note = "Proposed in keripy#1685, not on main. Self-asserted name=value attributes (e.g. `geo=ca`). See routes.md."

# ---- query (qry) ----
# keripy dispatches these twice: once by hard-coded gate lists
# (`route in ["logs", "ksn", "mbx"]` in core/parsing.py and core/eventing.py) and again
# in processQuery. getroutes.py fails if the gates and processQuery disagree.

[[route]]
msg = "qry"
route = "logs"
tier = "interop"
note = "Relative route, unlike every `rpy`/`exn` route."

[[route]]
msg = "qry"
route = "ksn"
tier = "interop"
note = "Relative. The reply comes back on `rpy /ksn/{aid}`."

[[route]]
msg = "qry"
route = "mbx"
tier = "interop"
note = "Relative. Mailbox poll; topics are listed under Mailbox topics."

[[route]]
msg = "qry"
route = "tels"
tier = "interop"
note = "Relative. Handled by Tevery."

[[route]]
msg = "qry"
route = "tsn"
tier = "interop"
note = "Relative. Handled by Tevery."

# ---- exchange (exn) ----

[[route]]
msg = "exn"
route = "/ipex/apply"
tier = "protocol"
note = "ACDC spec IPEX table names the step as bare `apply`, without `/ipex/`. Registered twice in keripy (vc/protocoling.py and acdc/ipexing.py)."

[[route]]
msg = "exn"
route = "/ipex/offer"
tier = "protocol"
note = "As `/ipex/apply`. The KERI spec uses `/ipex/offer` as its example of a transaction route."

[[route]]
msg = "exn"
route = "/ipex/agree"
tier = "protocol"
note = "As `/ipex/apply`."

[[route]]
msg = "exn"
route = "/ipex/grant"
tier = "protocol"
note = "As `/ipex/apply`. The two keripy handlers disagree on its legal predecessors: vc/protocoling.py allows only `agree`, acdc/ipexing.py allows `apply` or `agree`. Only vc/protocoling.py is wired into keripy's CLI; nothing in src imports acdc/ipexing.py."

[[route]]
msg = "exn"
route = "/ipex/admit"
tier = "protocol"
note = "As `/ipex/apply`."

[[route]]
msg = "exn"
route = "/ipex/spurn"
tier = "protocol"
note = "As `/ipex/apply`."


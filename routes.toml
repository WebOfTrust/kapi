# ---- matched outside the routers ----

[[route]]
msg = "adhoc"
route = "/oobi/witness"
tier = "protocol"
note = "`rpy` body of an OOBI HTTP response, dispatched by a comparison in `Oobiery` (app/oobiing.py:576). The KERI spec uses it as an example."

[[route]]
msg = "adhoc"
route = "/oobi/controller"
tier = "protocol"
note = "As `/oobi/witness`."

# ---- HTTP (falcon) ----
# Mounted by the witness app (app/indirecting.py setupWitness) unless noted.

[[route]]

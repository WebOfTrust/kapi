[[route]]
msg = "http"
route = "/end/{aid}/{role}"
tier = "application"
note = "ReST view of the endpoint-role database. Its spec hits are `rpy /end/role/add` and `/cut`, which this pattern also matches."

[[route]]
msg = "http"
route = "/loc"
tier = "application"
note = "ReST view of the location database."

[[route]]
msg = "http"
route = "/admin"
tier = "application"
note = "Endpoint administration."

[[route]]
msg = "http"
